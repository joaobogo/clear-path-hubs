name: TAASFlow branch style preparation
on:
  push:
    branches:
      - taasflow/off-system-workflow-intake-20261008

permissions:
  contents: write

concurrency:
  group: taasflow-format-branch-only
  cancel-in-progress: false

jobs:
  format:
    if: github.repository == 'joaobogo/clear-path-hubs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format only source files changed by this PR
        shell: bash
        run: |
          mapfile -d '' files < <(git diff --name-only -z --diff-filter=ACMR origin/main...HEAD -- 'src/**/*.ts' 'src/**/*.tsx' 'tests/**/*.ts' 'tests/**/*.tsx')
          if [ ${#files[@]} -gt 0 ]; then
            bunx prettier --write "${files[@]}"
            git add -- "${files[@]}"
          fi
      - name: Commit formatted changes to the feature branch
        shell: bash
        run: |
          if git diff --cached --quiet; then
            echo "Formatting already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format TAASFlow changes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
